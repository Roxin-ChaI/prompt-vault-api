[project]
name = "prompt-vault-api"
version = "0.1.0"
description = "A REST API for managing reusable prompts."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
    "alembic",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
